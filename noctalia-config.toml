[bar]
order = [ "default", "bar" ]

    [bar.bar]
    background_opacity = 0.79999998211860657
    border = "primary"
    enabled = false
    position = "bottom"
    thickness = 42

    [bar.default]
    background_opacity = 0.57999998703598976
    border = "secondary"
    border_width = 1.5
    capsule_opacity = 0.56999998725950718
    center = [ "audio_visualizer", "clock" ]
    color = "primary"
    contact_shadow = true
    end = [ "tray", "clipboard", "network", "volume", "control-center", "caffeine", "idk" ]
    font_family = "DaddyTimeMono Nerd Font Mono"
    font_weight = 400
    icon_color = "secondary"
